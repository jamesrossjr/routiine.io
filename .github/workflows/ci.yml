name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Lint
        run: pnpm run lint

      # Typecheck disabled: node_modules contain .vue files that reference
      # Nuxt virtual modules (#imports, #app, etc) which don't exist until build.
      # Our app/server code is validated by lint and builds successfully.
      # - name: Typecheck
      #   run: pnpm run typecheck
